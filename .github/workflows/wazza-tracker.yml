name: wazza-tracker

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wazza-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recolher IOCs
        run: python3 wazza_tracker.py
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          TINES_WEBHOOK_URL: ${{ secrets.TINES_WEBHOOK_URL }}

      - name: Commit
        run: |
          git config user.name "wazza-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "iocs $(date -u +'%F %H:%M')"
            git push
          fi
